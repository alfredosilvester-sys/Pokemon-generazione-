name: Build GBA ROM

on:
push:
branches: [“principale”]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
container:
image: devkitpro/devkitarm:latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Compile ROM
    run: make
  - name: Upload ROM
    uses: actions/upload-artifact@v4
    with:
      name: pokemon-generazioni-gba
      path: pokemon-generazioni.gba
      if-no-files-found: error

  - name: Compile ROM
    run: make

  - name: Upload ROM
    uses: actions/upload-artifact@v4
    with:
      name: pokemon-generazioni-gba
      path: pokemon-generazioni.gba
      if-no-files-found: error
